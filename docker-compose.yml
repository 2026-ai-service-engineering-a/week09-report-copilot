# 9주차 실습 랩 — 화면과 에이전트가 같은 문서를 본다.
#
#   cp .env.sample .env             # 키는 없어도 된다 (각본 대역이 대신 답한다)
#   docker compose up --build -d
#   docker compose exec api python -m scripts.load_data
#   열어 볼 곳: http://localhost:3000 (화면) · http://localhost:8000/docs (계약)
#   docker compose exec api pytest
#
# 8주차와 다른 점이 둘이다.
#
#   ① 문을 갈라 두지 않는다. 그때는 문이 주제라 api와 mcp를 일부러 나눴고,
#      이번 주는 **상태가 하나**라는 것이 주제라 한 프로세스에 둔다
#   ② **게이트웨이가 없다.** 8주차 8장의 판단 그대로다. 부르는 곳이 하나면
#      직접 호출이 맞고, 게이트웨이는 장애점을 하나 늘릴 뿐이다.
#      10~14주차 개인 프로젝트도 대개 이쪽이다
#
# 분리와 합침의 기준은 취향이 아니라 무엇을 보이려는가에 있다 (교안 2장 2절).
services:
  api:                                   # AG-UI 엔드포인트 + 그래프 + 코어
    build: .
    image: week09-report-copilot
    # 키는 `.env`에 있고 이 컨테이너에만 간다. 브라우저 번들에는 들어가지
    # 않는다. 화면은 우리 api만 부르고 모델은 서버가 부른다
    environment:
      LLM_MODE: ${LLM_MODE:-auto}
      LLM_MODEL: ${LLM_MODEL:-}
      # 프로바이더를 직접 부른다. 하나만 채우면 된다
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 모델이 질의를 짠다. 그래서 앱이 쥐는 연결도 읽기 전용이다 (교안 9장 1절).
      # 게이트가 뚫려도 DB 권한이 한 층 더 막는다
      DATABASE_URL: postgresql://reader:reader@db:5432/boxoffice
      # 적재 스크립트만 쓰기 권한이 필요하다
      ADMIN_DATABASE_URL: postgresql://report:report@db:5432/boxoffice
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  web:                                   # 화면. v0~v3 네 모드가 한 앱에 있다
    build: ./web                         # React + Vite를 빌드해 nginx가 낸다
    ports:
      - "3000:80"
    depends_on:
      - api

  db:                                    # 박스오피스 집계 + 리포트 문서
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: report
      POSTGRES_PASSWORD: report
      POSTGRES_DB: boxoffice
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 읽기 전용 계정을 처음 기동에 만든다 (교안 9장 1절)
      - ./scripts/initdb.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report -d boxoffice"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:                                # 데이터와 리포트 문서. 초기화는 down -v 로만
