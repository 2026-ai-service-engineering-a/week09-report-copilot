server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # 화면은 api와 같은 출처에서 온 것처럼 보이게 프록시한다.
  # **버퍼링을 끄는 것이 중요하다.** 켜 두면 프록시가 SSE를 통째로 모았다가
  # 한 번에 주고, 그러면 상태가 차오르는 것이 화면에 보이지 않는다
  # (8주차 4장 6절의 그 함정).
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    chunked_transfer_encoding on;
  }
}
