# 게이트웨이가 아는 모델 목록. 앱은 여기 적힌 **별명**만 안다.
# 어느 회사 모델인지는 앱이 모르고, 바꿔도 앱을 다시 배포하지 않는다.
model_list:
  - model_name: report              # 진짜 모델. gateway/.env의 키로 나간다
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: report-demo         # 키가 없어도 도는 시연용
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "not-needed"
      mock_response: "게이트웨이의 모의 응답입니다. 진짜 모델을 부르지 않았습니다."

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # 이 키로만 가상키를 발급한다
